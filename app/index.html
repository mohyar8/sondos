do <!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon / apple-touch-icon: generated by another unit in this same
         wave at these exact paths (public/images/brand/). The previous
         ./public/images/brand-logo.jpeg reference was both a broken Vite
         public-asset path and the cause of the 510.93 kB duplicate-asset
         build defect recorded in the baseline. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/images/brand/favicon-32.png" />
    <link rel="apple-touch-icon" href="/images/brand/apple-touch-icon.png" />
    <meta name="theme-color" content="#FFFCF7" />

    <meta
      name="description"
      content="المصورة سندس يار، مصورة عرائس محترفة في المدينة المنورة، توثّق تفاصيل يومكِ بأسلوب هادئ وأنيق."
    />

    <!-- Open Graph / Twitter — static baseline only (runs/redo-v2/04-seo.md §4).
         The production domain is UNKNOWN (no routes/custom domain in
         wrangler.jsonc, none recorded in decisions.md): og:url and
         rel="canonical" are intentionally omitted rather than pointing at a
         placeholder. og:image/twitter:image are omitted too — no verified
         1200×630 image asset exists yet (04-seo.md §4 flags this as a
         separate image-pipeline task). No JSON-LD: every example in
         04-seo.md §5 depends on the same unresolved domain and an
         unconfirmed telephone/priceRange presentation, so none of it is
         "ONLY facts verified in decisions.md and the inspection report" yet. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="المصورة سندس يار" />
    <meta property="og:title" content="المصورة سندس يار | مصورة عرائس في المدينة المنورة" />
    <meta
      property="og:description"
      content="المصورة سندس يار، مصورة عرائس محترفة في المدينة المنورة، توثّق تفاصيل يومكِ بأسلوب هادئ وأنيق."
    />
    <meta property="og:locale" content="ar_SA" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="المصورة سندس يار | مصورة عرائس في المدينة المنورة" />
    <meta
      name="twitter:description"
      content="المصورة سندس يار، مصورة عرائس محترفة في المدينة المنورة، توثّق تفاصيل يومكِ بأسلوب هادئ وأنيق."
    />

    <title>المصورة سندس يار</title>

    <!-- Hero LCP preload, home page only. The hero <picture> is rendered by
         React, so without this the browser only discovers the photo after
         the entry JS has downloaded and run. index.html is the SPA fallback
         for every route, so the link is added from this script only on "/".
         imagesrcset/imagesizes MUST stay identical to the AVIF <source> that
         src/pages/home/HeroSection.tsx renders (siteImages["bouquet-bisht"]
         variants + HERO_IMAGE_SIZES), or the browser downloads the photo
         twice. Editing the script body changes its hash: update the
         'sha256-…' source in public/_headers (script-src) to match. -->
    <script>if(location.pathname==='/'){const l=document.createElement('link');l.rel='preload';l.as='image';l.type='image/avif';l.setAttribute('fetchpriority','high');l.setAttribute('imagesrcset','/images/site/bouquet-bisht-480.avif 480w, /images/site/bouquet-bisht-800.avif 800w, /images/site/bouquet-bisht-1200.avif 1200w, /images/site/bouquet-bisht-1600.avif 1600w');l.setAttribute('imagesizes','(min-width: 80rem) 41rem, (min-width: 64rem) 50vw, calc(100vw - 2rem)');document.head.appendChild(l)}</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
