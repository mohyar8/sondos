do <!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon: the «سندس» calligraphy from the official logo on a Paper
         square, written by scripts/make-favicon.mjs. The 48 px ICO and the
         512 px PNG are the sizes search engines pick (a multiple of 48 px);
         /favicon.ico also answers browsers that request it unasked.
         ?v= changes whenever the icons change: /images/* is cached for a
         week (public/_headers). theme-color is --color-paper. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/images/brand/favicon-32.png?v=2" />
    <link rel="icon" type="image/png" sizes="512x512" href="/images/brand/icon-512.png?v=2" />
    <link rel="apple-touch-icon" href="/images/brand/apple-touch-icon.png?v=2" />
    <meta name="theme-color" content="#FFFCF7" />

    <meta
      name="description"
      content="المصورة سندس يار، مصورة عرائس محترفة في المدينة المنورة، توثّق تفاصيل يومكِ بأسلوب هادئ وأنيق."
    />

    <!-- Open Graph / Twitter: Home's values. Social-share bots do not run
         JavaScript, so they only ever see these; src/layout/route-meta.ts
         keeps title, description, og:url and the canonical link in step with
         each route for crawlers that do (the canonical is added there only,
         because this one file is served for every route). og:image is the
         Home hero photo, already public on the site. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="المصورة سندس يار" />
    <meta property="og:title" content="المصورة سندس يار | مصورة عرائس في المدينة المنورة" />
    <meta
      property="og:description"
      content="المصورة سندس يار، مصورة عرائس محترفة في المدينة المنورة، توثّق تفاصيل يومكِ بأسلوب هادئ وأنيق."
    />
    <meta property="og:url" content="https://sndsyar.com/" />
    <meta property="og:locale" content="ar_SA" />
    <meta property="og:image" content="https://sndsyar.com/images/site/bouquet-bisht-1200.webp" />
    <meta property="og:image:type" content="image/webp" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="1500" />
    <meta
      property="og:image:alt"
      content="باقة من زهور الكالا البيضاء والتوليب الوردي على بشت أسود مطرّز بالذهبي، من أعمال المصورة سندس يار"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="المصورة سندس يار | مصورة عرائس في المدينة المنورة" />
    <meta
      name="twitter:description"
      content="المصورة سندس يار، مصورة عرائس محترفة في المدينة المنورة، توثّق تفاصيل يومكِ بأسلوب هادئ وأنيق."
    />

    <title>المصورة سندس يار | مصورة عرائس في المدينة المنورة</title>

    <!-- Hero LCP preload, home page only. The hero <picture> is rendered by
         React, so without this the browser only discovers the photo after
         the entry JS has downloaded and run. index.html is the SPA fallback
         for every route, so the link is added from this script only on "/".
         imagesrcset/imagesizes MUST stay identical to the AVIF <source> that
         src/pages/home/HeroSection.tsx renders (siteImages["bouquet-bisht"]
         variants + HERO_IMAGE_SIZES), or the browser downloads the photo
         twice. Editing the script body changes its hash: update the
         'sha256-…' source in public/_headers (script-src) to match. -->
    <script>if(location.pathname==='/'){const l=document.createElement('link');l.rel='preload';l.as='image';l.type='image/avif';l.setAttribute('fetchpriority','high');l.setAttribute('imagesrcset','/images/site/bouquet-bisht-480.avif 480w, /images/site/bouquet-bisht-800.avif 800w, /images/site/bouquet-bisht-1200.avif 1200w, /images/site/bouquet-bisht-1600.avif 1600w');l.setAttribute('imagesizes','(min-width: 80rem) 41rem, (min-width: 64rem) 50vw, calc(100vw - 2rem)');document.head.appendChild(l)}</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
